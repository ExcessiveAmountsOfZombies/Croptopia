plugins {
    id 'fabric-loom' version '1.9-SNAPSHOT' apply(false)
    id 'net.neoforged.moddev.legacyforge' version '2.0.141' apply(false)
}


tasks.register("cleanUp") {
    group = 'build'
    description = "Cleans up fabric and forge"
    dependsOn ':fabric:clean', ':forge:clean'
    finalizedBy 'buildAllLoaders'
}

tasks.register('buildAllLoaders') {
    group = 'build'
    description = 'Builds both Fabric and Forge loader projects.'
    dependsOn ':fabric:build', ':forge:build'
    finalizedBy 'publishBuiltJars'
}

tasks.register('publishBuiltJars', Copy) {
    group = 'build'
    description = 'Copies built Fabric and Forge jars into the root Publish directory.'
    dependsOn ':fabric:build', ':forge:build'

    from(project(':fabric').layout.buildDirectory.dir('libs')) {
        include '*.jar'
    }
    from(project(':forge').layout.buildDirectory.dir('libs')) {
        include '*.jar'
    }

    into layout.projectDirectory.dir('Publish')
}
